name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. The action errors out if the version is
      # declared both here and as `packageManager` in package.json, and
      # package.json is the better authority — it pins an exact version that
      # Corepack enforces locally too, so CI and dev machines cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @salon/api prisma:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      # The spec's most expensive mistake, caught mechanically rather than
      # after Stage 4. Any stored running total fails the build.
      - name: Assert no balance columns
        run: |
          if grep -inE '^\s*(walletBalance|stockQty|sessionsLeft|commissionEarned|balance)\s+(Int|Decimal|Float)' apps/api/prisma/schema.prisma; then
            echo "::error::Stored running total found in schema.prisma. Use a ledger."
            exit 1
          fi
          echo "No balance columns. Ledgers intact."
